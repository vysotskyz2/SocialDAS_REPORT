volumes:
  reports_pg_data:
  reports_minio_data:
  reports_redis_data:

services:
  reports-db:
    image: postgres:17.0
    env_file: .env
    ports:
      - 5436:5432
    volumes:
      - reports_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  reports-redis:
    image: redis:7.4-alpine
    ports:
      - 6382:6379
    volumes:
      - reports_redis_data:/data
    networks:
      - microservices_network

  reports-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - reports_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  reports:
    build: .
    env_file: .env
    depends_on:
      reports-db:
        condition: service_healthy
      reports-minio:
        condition: service_healthy
      reports-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - 8007:8000
    volumes:
      - .:/reports_app
    networks:
      - microservices_network

  reports-worker:
    build: .
    command: taskiq worker src.infrastructure.tasks.broker:broker src.infrastructure.tasks.reports
    env_file: .env
    depends_on:
      reports-db:
        condition: service_healthy
      reports-minio:
        condition: service_healthy
      reports-redis:
        condition: service_started
    volumes:
      - .:/reports_app
    networks:
      - microservices_network

networks:
  microservices_network:
    external: true
