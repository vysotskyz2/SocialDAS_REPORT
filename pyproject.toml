[project]
name = "socialdas-report"
version = "0.1.0"
description = "SocialDAS Report service — Excel report generation with MinIO storage"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "sqlalchemy>=2.0.46",
    "asyncpg>=0.30.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "dependency-injector>=4.48.3",
    "loguru>=0.7.3",
    "httpx[http2]>=0.28.1",
    "alembic>=1.18.4",
    "openpyxl>=3.1.5",
    "miniopy-async>=1.21.1",
]
